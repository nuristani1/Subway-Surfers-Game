name: android-build

# Builds an Android APK on GitHub-hosted runners (no local Unity Editor needed).
# Triggered manually from the Actions tab, and by main.yml on push.

on:
  workflow_dispatch:
    inputs:
      unity_version:
        description: "Override the Unity version to build with"
        required: false
        default: ""
  workflow_call:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ github.ref }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-${{ github.ref }}-
            Library-Android-

      - name: Resolve Unity version
        id: unity
        shell: bash
        run: |
          PINNED="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+[a-z][0-9]+' ProjectSettings/ProjectVersion.txt | head -1)"
          OVERRIDE="${{ github.event.inputs.unity_version }}"
          VERSION="${OVERRIDE:-$PINNED}"
          echo "Using Unity version: $VERSION (pinned: $PINNED)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error title=Missing Unity secrets::Add UNITY_LICENSE (or UNITY_EMAIL + UNITY_PASSWORD) under Settings -> Secrets and variables -> Actions, then re-run. Unity can only be activated on GitHub's runners, never in this sandbox."
            exit 1
          fi
          echo "Unity activation credentials present."

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: ${{ steps.unity.outputs.version }}
          allowDirtyBuild: true
          buildName: Subway-Surfers

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Subway-Surfers-APK
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to the current release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Android/*.apk
